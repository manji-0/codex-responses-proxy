[package]
name = "codex-responses-proxy"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible proxy that forwards requests to Codex app-server with conversation continuity and streaming support."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/manji-0/codex-responses-proxy"
keywords = ["openai", "proxy", "codex", "chatgpt", "cli"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
anyhow = "1.0"
bytes = "1.0"
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.28"
uuid = { version = "1.0", features = ["v4"] }
warp = "0.3"
